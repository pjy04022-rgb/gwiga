# 안드로이드 앱(APK) 자동 빌드
# main에 화면(웹 파일)이나 app/ 폴더가 바뀌어 올라오면 GitHub가 APK를 만들어
# 릴리스에 gwiga.apk로 올린다. 항상 최신 APK 주소:
#   https://github.com/pjy04022-rgb/gwiga/releases/latest/download/gwiga.apk
# Actions 탭에서 "Run workflow"로 직접 돌릴 수도 있다.
name: 안드로이드 앱 빌드

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    # Android SDK가 미리 깔려 있는 이미지로 고정한다
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Android SDK 36 준비
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            echo "SDK 명령줄 도구가 없어 내려받습니다"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt && rm -rf "$SDK/cmdline-tools/latest" && mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: 패키지 설치
        working-directory: app
        run: npm ci

      - name: APK 빌드
        working-directory: app
        run: npm run apk

      - name: 결과물 이름 정리
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk gwiga.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gwiga-apk
          path: gwiga.apk

      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-${{ github.run_number }}"
          gh release create "$TAG" gwiga.apk \
            --title "귀가약속 앱 1.0.${{ github.run_number }}" \
            --notes "휴대폰에서 gwiga.apk를 눌러 내려받아 설치하세요. 처음 설치할 때 '출처를 알 수 없는 앱' 설치를 허용해야 합니다. 이전 버전이 있으면 그 위에 업데이트됩니다." \
            --target "${{ github.sha }}" \
            --latest
